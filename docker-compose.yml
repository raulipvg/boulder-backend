services:
  api:
    container_name: boulder-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5001:5000"
    restart: unless-stopped
    networks:
      - boulder_shared

networks:
  boulder_shared:
    name: ${EXTERNAL_NETWORK_NAME:-boulder-red-interna-kali}
    external: true
